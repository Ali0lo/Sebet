services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sebet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sebet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sebet_secret}
      POSTGRES_DB: ${POSTGRES_DB:-sebet_db}
    ports:
      - "5432:5432"
    volumes:
      - sebet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sebet} -d ${POSTGRES_DB:-sebet_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sebet_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - sebet_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sebet_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-sebet}:${POSTGRES_PASSWORD:-sebet_secret}@db:5432/${POSTGRES_DB:-sebet_db}
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","http://frontend:3000"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python scripts/seed_baku_data.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sebet_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  sebet_pgdata:
  sebet_redisdata:

